name: Import V5 PWA from ivyhouse-website
# V5 source-sync trigger
# Pull latest v5-pwa after source-side admin/PWA updates

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Import V5 PWA' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test repository
        uses: actions/checkout@v4

      - name: Import v5-pwa branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ivyhouse-v5
          git clone --depth 1 --branch v5-pwa https://github.com/sunilbane19/ivyhouse-website.git /tmp/ivyhouse-v5
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          find /tmp/ivyhouse-v5 -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .gitignore -exec cp -a {} . \;
          rm -rf /tmp/ivyhouse-v5

      - name: Commit imported V5 site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import V5 PWA"
          git push origin HEAD:main
